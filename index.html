i học", "Phân luồng không liên quan đến nhu cầu nhân lực xã hội", "Phân luồng là quyết định chỉ dành cho học sinh có điểm thấp"], "explanation": "", "level": "VD", "answer": 0, "source": "123/2025/QH15 Điều 1 khoản 2, sửa Điều 9"}, {"id": 9, "set": 1, "number": 9, "text": "Theo Luật GDQP-AN, kiến thức quốc phòng và an ninh bao gồm những thành phần nào?", "options": ["Chỉ kiến thức kỹ thuật, chiến thuật của quân đội", "Chỉ nội dung huấn luyện thể lực và điều lệnh", "Chỉ pháp luật về tổ chức lực lượng vũ trang", "Quan điểm của Đảng, chính sách pháp luật, truyền thống và kỹ năng quân sự"], "explanation": "", "level": "NB–TH", "answer": 3, "source": "48/VBHN-VPQH năm 2026 Điều 3 khoản 1"}, {"id": 10, "set": 1, "number": 10, "text": "Nhận định nào đúng về chủ thể có trách nhiệm GDQP-AN?", "options": ["Chỉ cơ quan quân sự địa phương và trường quân đội", "Hệ thống chính trị và toàn dân; Nhà nước giữ vai trò chủ đạo", "Chỉ công dân thuộc độ tuổi thực hiện nghĩa vụ quân sự", "Chỉ giáo viên môn GDQP-AN của trường phổ thông"], "explanation": "", "level": "NB–TH", "answer": 1, "source": "48/VBHN-VPQH năm 2026 Điều 5 khoản 2"}, {"id": 11, "set": 1, "number": 11, "text": "Chính sách ưu tiên nguồn lực GDQP-AN của Nhà nước hướng đến khu vực nào?", "options": ["Chỉ trường chuyên tại các đô thị trung tâm", "Biên giới, hải đảo, miền núi, vùng sâu, vùng xa", "Chỉ cơ sở giáo dục đại học có trung tâm GDQP-AN", "Chỉ các khu công nghiệp, khu chế xuất"], "explanation": "", "level": "NB–TH", "answer": 1, "source": "48/VBHN-VPQH năm 2026 Điều 6 khoản 1"}, {"id": 12, "set": 1, "number": 12, "text": "Nguyên tắc nào phản ánh đúng yêu cầu tổ chức GDQP-AN?", "options": ["Thực hiện riêng lý thuyết và loại trừ thực hành", "Tách GDQP-AN khỏi phổ biến, giáo dục pháp luật", "Chỉ ưu tiên việc ghi nhớ thuật ngữ", "Kết hợp lý luận với thực tiễn, lý thuyết với thực hành"], "explanation": "", "level": "NB–TH", "answer": 3, "source": "48/VBHN-VPQH năm 2026 Điều 5 khoản 3, 4"}, {"id": 13, "set": 1, "number": 13, "text": "Theo văn bản hợp nhất 53/VBHN-BQP, vấn đề nào thuộc phạm vi quy định chi tiết?", "options": ["Quy trình thi tốt nghiệp môn Toán THPT", "Tuyển sinh đại học chính quy mọi ngành học", "Biện pháp thi hành một số điều Luật GDQP-AN và bồi dưỡng kiến thức GDQP-AN", "Tiêu chuẩn cấp giấy phép lái xe cơ giới"], "explanation": "", "level": "NB–TH", "answer": 2, "source": "53/VBHN-BQP năm 2025 Điều 1"}, {"id": 14, "set": 1, "number": 14, "text": "Một trường ở địa bàn biên giới đề xuất hỗ trợ thiết bị GDQP-AN. Căn cứ pháp lý phù hợp nhất cho ưu tiên đầu tư là gì?", "options": ["Quy định mọi trường biên giới được miễn hoàn toàn đánh giá môn học", "Quy định cho phép thay chương trình bằng hoạt động ngoại khóa", "Quy định chỉ giao phụ huynh bảo đảm kinh phí thiết bị", "Chính sách Nhà nước ưu tiên nguồn lực GDQP-AN cho khu vực biên giới"], "explanation": "", "level": "VD", "answer": 3, "source": "48/VBHN-VPQH năm 2026 Điều 6 khoản 1"}, {"id": 15, "set": 1, "number": 15, "text": "Giáo viên dự định dùng hình ảnh tài liệu chưa được xác định là công khai trong bài học và giao học sinh đăng lên mạng. Phương án nào đáp ứng tốt nhất đồng thời mục tiêu học tập và yêu cầu bảo mật?", "options": ["Hủy toàn bộ hoạt động thực hành vì không thể bảo đảm an toàn thông tin", "Cho học sinh đăng trước rồi gỡ nếu cơ quan chức năng có ý kiến", "Kiểm tra phân loại tài liệu, chỉ sử dụng nội dung được phép công khai và thiết kế nhiệm vụ tương đương", "Chỉ bỏ tên đơn vị trên hình rồi cho đăng mọi tài liệu"], "explanation": "", "level": "VDC", "answer": 2, "source": "48/VBHN-VPQH năm 2026 Điều 5 khoản 6; 46/2020/TT-BGDĐT mục VI"}, {"id": 16, "set": 1, "number": 16, "text": "Theo Nghị quyết 281/NQ-CP, nhiệm vụ trung tâm của chương trình hành động là gì?", "options": ["Chuyển toàn bộ giáo dục phổ thông sang hình thức trực tuyến", "Ban hành quy chế tuyển dụng quân nhân chuyên nghiệp", "Thực hiện Nghị quyết 71-NQ/TW về đột phá phát triển giáo dục và đào tạo", "Thay thế chương trình môn học quốc phòng bằng giáo dục thể chất"], "explanation": "", "level": "NB–TH", "answer": 2, "source": "281/NQ-CP 15/9/2025 Điều 1; phần I"}, {"id": 17, "set": 1, "number": 17, "text": "Nghị quyết 248/2025/QH15 quy định thẩm quyền tuyển dụng nhà giáo ở cơ sở giáo dục phổ thông công lập trên địa bàn tỉnh thuộc ai?", "options": ["Chủ tịch Hội đồng GDQP-AN Trung ương", "Giám đốc Sở Giáo dục và Đào tạo", "Bộ trưởng Bộ Quốc phòng trực tiếp tuyển dụng", "Hiệu trưởng tự quyết tuyển dụng mọi trường không có phân cấp"], "explanation": "", "level": "NB–TH", "answer": 1, "source": "248/2025/QH15 Điều 2 khoản 1 điểm a"}, {"id": 18, "set": 1, "number": 18, "text": "Theo Nghị quyết 248/2025/QH15, chính sách SGK từ năm học 2026–2027 nêu yêu cầu nào?", "options": ["Bỏ yêu cầu chương trình giáo dục phổ thông thống nhất", "Cho phép mỗi xã ban hành bộ SGK bắt buộc riêng", "Chỉ sử dụng tài liệu do từng trường tự biên soạn", "Quyết định một bộ SGK giáo dục phổ thông sử dụng thống nhất toàn quốc"], "explanation": "", "level": "NB–TH", "answer": 3, "source": "248/2025/QH15 Điều 3 khoản 1"}, {"id": 19, "set": 1, "number": 19, "text": "Một tổ chuyên môn đề xuất đổi mới phương pháp theo mục tiêu đột phá giáo dục. Đề xuất nào phù hợp định hướng chương trình hành động của Chính phủ?", "options": ["Chỉ mua thiết bị mà không gắn với phương pháp và năng lực giáo viên", "Chỉ tăng số bài kiểm tra ghi nhớ để tạo thay đổi hình thức", "Chỉ tăng số lượng học sinh nhưng bỏ qua chất lượng và công bằng", "Đổi mới chất lượng, phương pháp và năng lực đội ngũ gắn với yêu cầu triển khai nhiệm vụ cụ thể"], "explanation": "", "level": "VD", "answer": 3, "source": "281/NQ-CP 15/9/2025 chương trình hành động mục I–II"}, {"id": 20, "set": 1, "number": 20, "text": "Theo Thông tư 22/2021, căn cứ trực tiếp để đánh giá học sinh là gì?", "options": ["Yêu cầu cần đạt trong Chương trình giáo dục phổ thông", "Mức độ tham gia hoạt động tự nguyện ngoài trường", "Số bài tập được giáo viên giao trong học kỳ", "So sánh thành tích từng học sinh với bạn đứng đầu lớp"], "explanation": "", "level": "NB–TH", "answer": 0, "source": "22/2021/TT-BGDĐT Điều 4 khoản 1"}, {"id": 21, "set": 1, "number": 21, "text": "Theo Thông tư 22/2021, yêu cầu nào cần bảo đảm trong đánh giá học sinh?", "options": ["Chính xác, toàn diện, công bằng, trung thực và khách quan", "Ưu tiên so sánh học sinh để tăng cạnh tranh", "Chỉ dựa kết quả thi cuối kỳ để đánh giá mọi quá trình", "Dùng duy nhất một hình thức đánh giá cho mọi nội dung"], "explanation": "", "level": "NB–TH", "answer": 0, "source": "22/2021/TT-BGDĐT Điều 4 khoản 2–4"}, {"id": 22, "set": 1, "number": 22, "text": "Trong Thông tư 46/2020, dạy học GDQP-AN được định hướng thế nào?", "options": ["Chỉ thực hiện thuyết trình và đọc–chép nội dung giáo khoa", "Khai thác phương pháp phát huy tính tích cực của học sinh, phối hợp lý thuyết và thực hành", "Không cần thay đổi hình thức dạy học theo nội dung và đối tượng", "Chỉ dùng bài tập ghi nhớ thay hoạt động thực hành"], "explanation": "", "level": "NB–TH", "answer": 1, "source": "46/2020/TT-BGDĐT mục VI"}, {"id": 23, "set": 1, "number": 23, "text": "Một học sinh tiến bộ rõ trong giờ thực hành nhưng kết quả kiểm tra viết chưa phản ánh hết. Giáo viên nên làm gì theo định hướng đánh giá?", "options": ["Cho điểm tối đa không dựa trên tiêu chí để khuyến khích", "Kết hợp quan sát, thực hành và bài viết, phản hồi để hỗ trợ sự tiến bộ", "So sánh em với học sinh yếu nhất để quyết định mức đánh giá", "Chỉ dùng điểm kiểm tra viết vì quan sát không thuộc đánh giá"], "explanation": "", "level": "VD", "answer": 1, "source": "22/2021/TT-BGDĐT Điều 2–4; 46/2020 mục VII"}, {"id": 24, "set": 1, "number": 24, "text": "Trong kiểm tra thực hành, một học sinh có hạn chế vận động tạm thời; yêu cầu cần đạt vẫn phải được đánh giá. Phương án nào cân bằng công bằng và tính giá trị?", "options": ["Cho điểm bằng các bạn mà không thu thập minh chứng học tập", "Miễn hoàn toàn mọi nội dung của môn học chỉ theo đề nghị miệng", "Xác định yêu cầu cần đạt, xem xét điều kiện cụ thể và lựa chọn minh chứng/hình thức hợp lệ theo quy định", "Dùng một thao tác không phù hợp cho mọi trường hợp và không điều chỉnh"], "explanation": "", "level": "VDC", "answer": 2, "source": "22/2021/TT-BGDĐT Điều 4; 46/2020 mục VII; cần rà soát quy định trường hợp đặc thù"}, {"id": 25, "set": 1, "number": 25, "text": "Theo SGK GDQP-AN 10 Bài 1, lực lượng nào thuộc nhóm lực lượng vũ trang nhân dân Việt Nam được giới thiệu?", "options": ["Công an nhân dân, Thanh tra và Viện kiểm sát", "Dân quân tự vệ, Cảnh sát biển và lực lượng dự bị dân sự độc lập", "Quân đội nhân dân, Hải quan và Kiểm lâm", "Quân đội nhân dân, Công an nhân dân và Dân quân tự vệ"], "explanation": "", "level": "NB–TH", "answer": 3, "source": "SGK KNTT GDQP-AN 10 Bài 1, tr.5–10"}, {"id": 26, "set": 1, "number": 26, "text": "Khi tham gia giao thông, hành vi nào phù hợp nguyên tắc phòng chống vi phạm pháp luật?", "options": ["Đi theo xe phía trước bất kể tín hiệu giao thông", "Chỉ chấp hành tín hiệu khi có lực lượng chức năng trực tiếp kiểm tra", "Dùng điện thoại khi điều khiển phương tiện nếu đường vắng", "Chấp hành hiệu lệnh, tín hiệu giao thông và quy định đối với người tham gia"], "explanation": "", "level": "NB–TH", "answer": 3, "source": "SGK KNTT GDQP-AN 10 Bài 4, tr.21–26; cần đối chiếu luật giao thông hiện hành"}, {"id": 27, "set": 1, "number": 27, "text": "Trong chủ đề an ninh mạng ở SGK lớp 10, biện pháp nào bảo vệ tài khoản cá nhân phù hợp?", "options": ["Đặt mật khẩu đủ mạnh, không chia sẻ mã xác thực và cảnh giác đường dẫn lạ", "Sử dụng một mật khẩu ngắn cho mọi dịch vụ để dễ nhớ", "Tắt mọi cảnh báo đăng nhập để tránh gián đoạn", "Đưa mã xác thực cho người tự xưng là quản trị viên"], "explanation": "", "level": "NB–TH", "answer": 0, "source": "SGK KNTT GDQP-AN 10 Bài 6, tr.31–35"}, {"id": 28, "set": 1, "number": 28, "text": "Học sinh nhận liên kết lạ yêu cầu nhập mật khẩu tài khoản lớp để nhận tài liệu GDQP-AN. Hướng xử lý nào giảm rủi ro tốt nhất?", "options": ["Chuyển đường dẫn cho toàn lớp để mọi người tự thử trước", "Đăng công khai tài khoản lớp để nhờ người khác kiểm tra", "Không nhập thông tin, kiểm tra nguồn, báo người phụ trách và dùng kênh chính thức", "Dùng mật khẩu thật để xác minh rồi đổi ngay khi thấy bất thường"], "explanation": "", "level": "VD", "answer": 2, "source": "SGK KNTT GDQP-AN 10 Bài 6, tr.31–35"}, {"id": 29, "set": 1, "number": 29, "text": "Theo SGK GDQP-AN 11, biên giới quốc gia trên đất liền được xác định bằng hình thức nào?", "options": ["Chỉ bằng đường phân chia hành chính cấp tỉnh", "Hệ thống mốc quốc giới trên thực địa theo quy định", "Bằng ranh giới sử dụng đất giữa các hộ dân", "Chỉ bằng ảnh vệ tinh do cá nhân lập"], "explanation": "", "level": "NB–TH", "answer": 1, "source": "SGK KNTT GDQP-AN 11 Bài 1, tr.6–7"}, {"id": 30, "set": 1, "number": 30, "text": "Một hình thức hoạt động của tội phạm công nghệ cao mà SGK 11 nêu là gì?", "options": ["Lừa đảo chiếm đoạt tài sản qua không gian mạng", "Tổ chức các lớp kỹ năng số miễn phí có xác thực", "Hướng dẫn người dân thiết lập xác thực nhiều bước", "Cung cấp thông tin cảnh báo lừa đảo từ cơ quan chức năng"], "explanation": "", "level": "NB–TH", "answer": 0, "source": "SGK KNTT GDQP-AN 11 Bài 3, tr.19–23"}, {"id": 31, "set": 1, "number": 31, "text": "Trong nội dung phòng chống tệ nạn xã hội ở SGK 11, cách tiếp cận nào phù hợp?", "options": ["Nhận diện thủ đoạn, hiểu hậu quả và chủ động tham gia phòng ngừa", "Không cần nắm quy định pháp luật khi tuyên truyền phòng ngừa", "Chỉ xử lý sau khi người học đã có hành vi vi phạm", "Chỉ coi tệ nạn xã hội là vấn đề của cơ quan công an"], "explanation": "", "level": "NB–TH", "answer": 0, "source": "SGK KNTT GDQP-AN 11 Bài 3, tr.19–23"}, {"id": 32, "set": 1, "number": 32, "text": "Học sinh phát hiện vật nghi là vũ khí, vật liệu nổ trong khuôn viên trường. Phản ứng phù hợp nhất là gì?", "options": ["Đưa vật vào phòng thiết bị để tránh học sinh khác nhìn thấy", "Cử nhóm học sinh thử tháo lắp nhằm xác định vật thật hay giả", "Đăng vị trí chính xác lên mạng để mọi người đến quan sát", "Không tự ý tiếp xúc, cô lập khu vực an toàn và báo lực lượng có trách nhiệm"], "explanation": "", "level": "VD", "answer": 3, "source": "SGK KNTT GDQP-AN 11 Bài 7, tr.46–49; cần đối chiếu quy định an toàn hiện hành"}, {"id": 33, "set": 1, "number": 33, "text": "Theo SGK GDQP-AN 12, một nội dung bảo vệ Tổ quốc sau năm 1975 là gì?", "options": ["Chiến dịch Điện Biên Phủ năm 1954", "Phong trào Cần Vương cuối thế kỷ XIX", "Cuộc Tổng tiến công và nổi dậy Xuân 1975", "Chiến đấu bảo vệ biên giới Tây Nam và thực hiện nghĩa vụ quốc tế"], "explanation": "", "level": "NB–TH", "answer": 3, "source": "SGK KNTT GDQP-AN 12 Bài 1, tr.5–8"}, {"id": 34, "set": 1, "number": 34, "text": "Theo nội dung về truyền thống và nghệ thuật đánh giặc giữ nước của địa phương, học sinh cần thể hiện thái độ nào?", "options": ["Tìm hiểu, trân trọng và phát huy truyền thống trong nhiệm vụ phù hợp", "Chỉ ghi nhớ tên nhân vật, không quan tâm bài học lịch sử", "Thay tư liệu có nguồn bằng lời kể không kiểm chứng", "Xem truyền thống địa phương chỉ là tư liệu không cần gắn hiện tại"], "explanation": "", "level": "NB–TH", "answer": 0, "source": "SGK KNTT GDQP-AN 12 Bài 5, tr.38–46"}, {"id": 35, "set": 1, "number": 35, "text": "Trong phòng chống “diễn biến hòa bình”, hành động nào phù hợp trách nhiệm công dân được nêu trong SGK 12?", "options": ["Nâng cao cảnh giác, tiếp nhận thông tin có chọn lọc và chấp hành pháp luật", "Phát tán ngay thông tin chưa kiểm chứng để cảnh báo", "Tự xử lý cá nhân có quan điểm khác bằng biện pháp cưỡng ép", "Coi mọi ý kiến khác biệt đều là hành vi vi phạm pháp luật"], "explanation": "", "level": "NB–TH", "answer": 0, "source": "SGK KNTT GDQP-AN 12 Bài 4, tr.31–37"}, {"id": 36, "set": 1, "number": 36, "text": "Trong hoạt động tìm hiểu lịch sử bảo vệ biên giới sau 1975, lớp gặp hai nguồn đưa thông tin khác nhau về một sự kiện. Cách tổ chức nào tốt nhất?", "options": ["Chọn nguồn có nhiều lượt chia sẻ vì phản ánh nhận thức số đông", "Yêu cầu đối chiếu nguồn chính thống, thời điểm, bối cảnh và phân biệt sự kiện với bình luận trước khi kết luận", "Chỉ cho học sinh học thuộc một ý mà không bàn về căn cứ tư liệu", "Giữ cả hai thông tin như những sự thật ngang nhau để tránh tranh luận"], "explanation": "", "level": "VDC", "answer": 1, "source": "SGK KNTT GDQP-AN 12 Bài 1, tr.5–12; phương pháp khai thác tư liệu"}, {"id": 37, "set": 1, "number": 37, "text": "Theo định hướng phương pháp của Thông tư 46/2020, trong dạy học lý thuyết GDQP-AN giáo viên nên làm gì?", "options": ["Thay toàn bộ hình thành kiến thức bằng học thuộc định nghĩa", "Dùng độc thoại liên tục nhằm giảm thời lượng thảo luận", "Nêu vấn đề và tạo điều kiện để học sinh chủ động hình thành kiến thức", "Tách nội dung bài học khỏi hiểu biết sẵn có của học sinh"], "explanation": "", "level": "NB–TH", "answer": 2, "source": "46/2020/TT-BGDĐT mục VI.2.1"}, {"id": 38, "set": 1, "number": 38, "text": "Theo Thông tư 46/2020, sử dụng phương pháp truyền thống trong GDQP-AN nên theo hướng nào?", "options": ["Coi thuyết trình là phương pháp duy nhất có giá trị", "Phát huy tính tích cực và chủ động của học sinh", "Loại bỏ mọi trao đổi với học sinh để bảo đảm thời gian", "Ưu tiên nội dung trình chiếu hơn yêu cầu cần đạt"], "explanation": "", "level": "NB–TH", "answer": 1, "source": "46/2020/TT-BGDĐT mục VI"}, {"id": 39, "set": 1, "number": 39, "text": "Trong giờ thực hành, nhiều học sinh thao tác sai cùng một bước. Cách phản hồi nào ưu tiên phát triển năng lực?", "options": ["Chỉ yêu cầu học sinh xem video tại nhà mà không kiểm tra lại", "Cho dừng thao tác không an toàn, phân tích lỗi chung, làm mẫu và cho luyện lại có quan sát", "Chấm điểm ngay và chuyển sang nội dung tiếp theo để kịp tiến độ", "Cho học sinh tự sửa dù chưa xác định được nguyên nhân sai"], "explanation": "", "level": "VD", "answer": 1, "source": "46/2020/TT-BGDĐT mục VI–VII"}, {"id": 40, "set": 1, "number": 40, "text": "Một giờ thực hành có 40 học sinh, thiết bị hạn chế và mục tiêu gồm giải thích nguyên lý, làm đúng thao tác, đánh giá an toàn. Cách thiết kế tối ưu là gì?", "options": ["Cho toàn lớp đồng loạt thao tác với thiết bị dù không đủ điều kiện giám sát", "Chỉ kiểm tra lý thuyết rồi xác nhận mọi học sinh đạt kỹ năng thao tác", "Chia trạm nhiệm vụ, hướng dẫn an toàn, phân vai quan sát–thực hành và dùng bảng tiêu chí cho từng lượt", "Để một học sinh làm mẫu cả tiết, các em khác ghi chép và nhận điểm như nhau"], "explanation": "", "level": "VDC", "answer": 2, "source": "46/2020/TT-BGDĐT mục VI–VII; 22/2021 Điều 4"}, {"id": 41, "set": 2, "number": 1, "text": "Nguyên lý giáo dục theo Điều 3 Luật Giáo dục thể hiện trong phương án nào?", "options": ["Học đi đôi với hành, lý luận gắn với thực tiễn, nhà trường gắn gia đình và xã hội", "Học lý thuyết trước, thực hành chỉ dành cho hoạt động ngoại khóa", "Chỉ kết hợp giáo dục nhà trường với hoạt động kiểm tra", "Ưu tiên thực hành và tách khỏi kiến thức nền tảng"], "explanation": "", "level": "NB–TH", "answer": 0, "source": "43/2019/QH14 Điều 3"}, {"id": 42, "set": 2, "number": 2, "text": "Dấu hiệu nào phân biệt giáo viên với giảng viên theo khái niệm tại Luật Nhà giáo?", "options": ["Giáo viên là mọi người có học vị từ thạc sĩ trở lên", "Giảng viên chỉ giảng dạy ở cơ sở giáo dục phổ thông", "Giảng viên không thực hiện chương trình đào tạo trình độ cao đẳng", "Giáo viên thực hiện các chương trình giáo dục phổ thông theo phạm vi luật định"], "explanation": "", "level": "NB–TH", "answer": 3, "source": "73/2025/QH15 Điều 4 khoản 1, 2"}, {"id": 43, "set": 2, "number": 3, "text": "Theo Luật GDNN 2025, nguyên tắc nào định hướng hoạt động đào tạo nghề?", "options": ["Chỉ đào tạo các nghề được doanh nghiệp nhà nước đặt hàng", "Phân tách chương trình đào tạo khỏi nhu cầu tuyển dụng", "Gắn kết đào tạo với yêu cầu việc làm và thị trường lao động", "Tập trung vào tuyển sinh mà không cần bảo đảm chất lượng"], "explanation": "", "level": "NB–TH", "answer": 2, "source": "124/2025/QH15 Điều 4 khoản 3"}, {"id": 44, "set": 2, "number": 4, "text": "Theo Luật Nhà giáo, nguyên tắc nào phải được tôn trọng khi quản lý và phát triển nhà giáo?", "options": ["Không cần bồi dưỡng nâng cao chất lượng đội ngũ", "Áp dụng một phương pháp giảng dạy duy nhất cho mọi nhà giáo", "Quyền tự chủ và sáng tạo trong hoạt động chuyên môn của nhà giáo", "Đồng nhất nhiệm vụ nhà giáo với nhiệm vụ hành chính đơn thuần"], "explanation": "", "level": "NB–TH", "answer": 2, "source": "73/2025/QH15 Điều 5 khoản 4"}, {"id": 45, "set": 2, "number": 5, "text": "Theo Luật GDNN 2025, nội dung nào thuộc phạm vi hoạt động giáo dục nghề nghiệp?", "options": ["Chỉ tổ chức thi tuyển công chức", "Chỉ đào tạo quân sự cho lực lượng vũ trang", "Xây dựng chương trình, tổ chức đào tạo, bảo đảm và kiểm định chất lượng", "Chỉ cấp phát bằng tốt nghiệp phổ thông"], "explanation": "", "level": "NB–TH", "answer": 2, "source": "124/2025/QH15 Điều 3 khoản 1"}, {"id": 46, "set": 2, "number": 6, "text": "Một văn bằng được cấp dưới hình thức số theo Luật Giáo dục sửa đổi được nhìn nhận ra sao?", "options": ["Chỉ được công nhận trong phạm vi một trường", "Chỉ có giá trị khi đồng thời là giấy khen học sinh", "Đương nhiên không phải văn bằng vì không in trên giấy", "Có thể là văn bằng của hệ thống giáo dục quốc dân khi cấp theo quy định"], "explanation": "", "level": "NB–TH", "answer": 3, "source": "123/2025/QH15 Điều 1 khoản 3, sửa Điều 12"}, {"id": 47, "set": 2, "number": 7, "text": "Nhà trường thiết kế tuần học GDQP-AN và muốn bảo đảm nguyên lý giáo dục. Phương án nào phù hợp nhất?", "options": ["Tổ chức học kiến thức, thực hành theo điều kiện an toàn và liên hệ tình huống đời sống", "Chỉ tổ chức thực hành mà bỏ giải thích căn cứ, nguyên lý", "Dồn toàn bộ đánh giá vào một bài kiểm tra cuối khóa, không phản hồi giữa kỳ", "Hoàn thành lý thuyết trên giấy rồi thay toàn bộ thực hành bằng học thuộc"], "explanation": "", "level": "VD", "answer": 0, "source": "43/2019/QH14 Điều 3; 46/2020/TT-BGDĐT mục VI–VII"}, {"id": 48, "set": 2, "number": 8, "text": "Khi đổi mới kiểm tra GDQP-AN, tổ chuyên môn muốn đánh giá cả kiến thức và khả năng làm được. Lựa chọn nào gắn đúng mục tiêu giáo dục?", "options": ["Lấy điểm chuyên cần thay hoàn toàn cho đánh giá thực hành", "Đánh giá năng lực chỉ bằng bài trắc nghiệm thuật ngữ", "Kết hợp đánh giá nhận thức, thực hành và phản hồi quá trình học", "Bỏ tiêu chí đánh giá để tăng quyền tự chủ người học"], "explanation": "", "level": "VD", "answer": 2, "source": "43/2019/QH14 Điều 2–3; 46/2020/TT-BGDĐT mục VII"}, {"id": 49, "set": 2, "number": 9, "text": "Mục tiêu giáo dục quốc phòng và an ninh theo luật nhấn mạnh điều gì?", "options": ["Chỉ chuẩn hóa năng lực sử dụng khí tài", "Tinh thần yêu nước, truyền thống, ý thức trách nhiệm bảo vệ Tổ quốc", "Chỉ bồi dưỡng nhân sự quản lý quốc phòng", "Chỉ nâng cao thành tích thi đấu thể thao"], "explanation": "", "level": "NB–TH", "answer": 1, "source": "48/VBHN-VPQH năm 2026 Điều 4"}, {"id": 50, "set": 2, "number": 10, "text": "Theo Luật GDQP-AN, chương trình và nội dung cần được xây dựng trên cơ sở nào?", "options": ["Chỉ chú trọng các vấn đề lý thuyết không thay đổi", "Phù hợp với từng đối tượng và kịp thời đáp ứng tình hình thực tế", "Chỉ cập nhật sau khi thay đổi toàn bộ sách giáo khoa", "Giữ nguyên cùng nội dung và thời lượng cho mọi đối tượng"], "explanation": "", "level": "NB–TH", "answer": 1, "source": "48/VBHN-VPQH năm 2026 Điều 5 khoản 5"}, {"id": 51, "set": 2, "number": 11, "text": "Theo Luật GDQP-AN, quyền và trách nhiệm của công dân được diễn đạt thế nào?", "options": ["Chỉ thực hiện nếu thuộc lực lượng dân quân tự vệ", "Học tập, nghiên cứu để nắm vững kiến thức quốc phòng và an ninh", "Chỉ tham gia khi có giấy giới thiệu của cơ quan", "Chỉ học kiến thức này khi được gọi nhập ngũ"], "explanation": "", "level": "NB–TH", "answer": 1, "source": "48/VBHN-VPQH năm 2026 Điều 7"}, {"id": 52, "set": 2, "number": 12, "text": "Luật GDQP-AN đặt ra yêu cầu nào về tính chất chương trình?", "options": ["Bảo đảm khoa học, hiện đại, dễ hiểu, thiết thực và hiệu quả", "Chỉ dựa trên kinh nghiệm truyền miệng", "Tập trung thành tích kiểm tra hơn yêu cầu bí mật nhà nước", "Duy trì thống nhất mọi hình thức không cần phân hóa"], "explanation": "", "level": "NB–TH", "answer": 0, "source": "48/VBHN-VPQH năm 2026 Điều 5 khoản 6"}, {"id": 53, "set": 2, "number": 13, "text": "Trong GDQP-AN, vì sao phải gắn giáo dục với pháp luật và chính trị tư tưởng?", "options": ["Đây là một nguyên tắc được luật xác định trong tổ chức GDQP-AN", "Vì có thể thay nội dung GDQP-AN bằng môn khác", "Vì pháp luật chỉ áp dụng cho trường phổ thông", "Vì mọi đánh giá đều phải chuyển thành kiểm tra viết"], "explanation": "", "level": "NB–TH", "answer": 0, "source": "48/VBHN-VPQH năm 2026 Điều 5 khoản 3"}, {"id": 54, "set": 2, "number": 14, "text": "Một nhóm xây kế hoạch GDQP-AN dành cho học sinh với điều kiện thiết bị và trải nghiệm khác nhau. Chọn cách đáp ứng tốt nhất nguyên tắc luật định.", "options": ["Giảm yêu cầu học tập của nhóm thiếu thiết bị mà không bổ sung hình thức khác", "Điều chỉnh hình thức phù hợp đối tượng nhưng giữ mục tiêu và yêu cầu cần đạt", "Chỉ kiểm tra kiến thức nhóm được trải nghiệm thực tế", "Áp dụng chung một cách tổ chức cho mọi nhóm dù không khả thi"], "explanation": "", "level": "VD", "answer": 1, "source": "48/VBHN-VPQH năm 2026 Điều 5 khoản 4, 5; 46/2020 mục VI"}, {"id": 55, "set": 2, "number": 15, "text": "Trong giờ học, tài liệu do học sinh chia sẻ có dấu hiệu thuộc loại cần bảo vệ và đã gửi trong nhóm lớp. Giáo viên nên xử lý theo thứ tự nào?", "options": ["Ngăn lan truyền, bảo lưu thông tin cần thiết, báo người có trách nhiệm và dùng nguồn công khai để tiếp tục bài", "Chuyển tài liệu cho lớp khác để cùng đánh giá trước khi xác định tính chất", "Cho phép tiếp tục chia sẻ trong nhóm kín vì không phải công khai", "Yêu cầu tất cả học sinh xóa ngay mà không thông báo người phụ trách"], "explanation": "", "level": "VDC", "answer": 0, "source": "48/VBHN-VPQH năm 2026 Điều 5 khoản 6; quy tắc sư phạm về bảo đảm an toàn"}, {"id": 56, "set": 2, "number": 16, "text": "Một nội dung thuộc chính sách phát triển nguồn nhân lực trong Nghị quyết 248/2025/QH15 là gì?", "options": ["Đổi mọi cơ sở giáo dục công lập thành cơ sở nghề nghiệp", "Bãi bỏ hoạt động bồi dưỡng nghề nghiệp cho nhà giáo", "Bỏ tất cả trách nhiệm quản lý của cơ quan giáo dục", "Cơ chế tuyển dụng, sử dụng và quản lý nhân lực ngành giáo dục"], "explanation": "", "level": "NB–TH", "answer": 3, "source": "248/2025/QH15 Điều 2"}, {"id": 57, "set": 2, "number": 17, "text": "Theo Nghị quyết 248/2025/QH15, chính sách phụ cấp ưu đãi nghề cho giáo viên phổ thông công lập được triển khai như thế nào?", "options": ["Mọi giáo viên do hiệu trưởng tự ấn định mức phụ cấp", "Áp dụng cùng một mức cố định cho mọi vị trí từ ngày ký nghị quyết", "Chỉ chi khi nhà giáo trực tiếp giảng dạy môn GDQP-AN", "Theo lộ trình do Chính phủ quy định với mức tối thiểu nêu trong nghị quyết"], "explanation": "", "level": "NB–TH", "answer": 3, "source": "248/2025/QH15 Điều 2 khoản 2 điểm a"}, {"id": 58, "set": 2, "number": 18, "text": "Nghị quyết 281/NQ-CP đặt mục tiêu gì cho chương trình hành động?", "options": ["Chỉ tập trung công tác xây dựng cơ sở vật chất, không cải thiện chất lượng", "Thể chế hóa và tổ chức thực hiện quan điểm, mục tiêu, nhiệm vụ của Nghị quyết 71-NQ/TW", "Chuyển chương trình giáo dục phổ thông thành đào tạo nghề", "Đình chỉ tất cả hoạt động hợp tác quốc tế về giáo dục"], "explanation": "", "level": "NB–TH", "answer": 1, "source": "281/NQ-CP chương trình hành động mục I khoản 1"}, {"id": 59, "set": 2, "number": 19, "text": "Một Sở GDĐT xây kế hoạch thực hiện chính sách phát triển giáo dục nhưng thiếu đơn vị chịu trách nhiệm và tiến độ. Theo logic Nghị quyết 281/NQ-CP, điều chỉnh nào cần ưu tiên?", "options": ["Giữ các khẩu hiệu định hướng chung mà không phân công thực hiện", "Cụ thể hóa nhiệm vụ, cơ quan phối hợp, sản phẩm, lộ trình và kiểm tra thực hiện", "Chuyển mọi mục tiêu thành chỉ tiêu thiết bị, không theo dõi chất lượng", "Chỉ yêu cầu các trường tự tìm tài liệu mà không tổng hợp kết quả"], "explanation": "", "level": "VD", "answer": 1, "source": "281/NQ-CP chương trình hành động mục I–II và phụ lục nhiệm vụ"}, {"id": 60, "set": 2, "number": 20, "text": "Nhận định nào về đánh giá thường xuyên phù hợp Thông tư 22/2021?", "options": ["Chỉ nhằm xếp hạng học sinh trong khối", "Chỉ thực hiện bằng bài thi viết trên giấy", "Diễn ra trong quá trình dạy học và cung cấp phản hồi để điều chỉnh", "Chỉ tổ chức sau khi hoàn thành cả năm học"], "explanation": "", "level": "NB–TH", "answer": 2, "source": "22/2021/TT-BGDĐT Điều 2 khoản 2"}, {"id": 61, "set": 2, "number": 21, "text": "Thông tư 19/2022/TT-BGDĐT ban hành nội dung gì?", "options": ["Chương trình đào tạo sĩ quan chỉ huy", "Khung xếp loại chức danh nghề nghiệp nhà giáo", "Quy chế đánh giá học sinh THCS và THPT", "Danh mục thiết bị dạy học tối thiểu môn GDQP-AN cho các cấp, loại hình được quy định"], "explanation": "", "level": "NB–TH", "answer": 3, "source": "19/2022/TT-BGDĐT Điều 1"}, {"id": 62, "set": 2, "number": 22, "text": "Thông tư 22/2021 xác định mục đích đánh giá học sinh nhằm mục tiêu nào?", "options": ["Chủ yếu tạo bảng xếp hạng công khai của lớp", "Cung cấp thông tin chính xác kịp thời để người học và giáo viên điều chỉnh hoạt động", "Tập trung loại trừ học sinh có kết quả chưa đạt", "Thay thế hoạt động tư vấn và hướng dẫn người học"], "explanation": "", "level": "NB–TH", "answer": 1, "source": "22/2021/TT-BGDĐT Điều 3"}, {"id": 63, "set": 2, "number": 23, "text": "Tổ GDQP-AN muốn bổ sung học liệu điện tử để thay thế nội dung thiếu tranh in. Cách thực hiện nào đúng định hướng văn bản?", "options": ["Bỏ phần hình ảnh minh họa vì đã có sách giáo khoa", "Chỉ mua thiết bị đắt nhất mà không xem yêu cầu từng bài", "Đối chiếu danh mục thiết bị tối thiểu và bảo đảm phương án trình chiếu đáp ứng mục tiêu dạy học", "Coi mọi hình ảnh trên mạng tương đương thiết bị được quy định không cần kiểm chứng"], "explanation": "", "level": "VD", "answer": 2, "source": "19/2022/TT-BGDĐT danh mục cấp THPT; 46/2020 mục VI"}, {"id": 64, "set": 2, "number": 24, "text": "Kết quả kiểm tra GDQP-AN của hai lớp chênh lệch; một lớp được luyện đề cũ, lớp còn lại học qua tình huống. Trước khi kết luận về năng lực, cần làm gì?", "options": ["Bỏ qua khác biệt công cụ vì hai lớp học cùng môn", "Coi điểm cao hơn là bằng chứng chắc chắn về năng lực cao hơn", "Xếp loại giáo viên dựa duy nhất vào trung bình điểm hai lớp", "Đối chiếu yêu cầu cần đạt, độ tương đương công cụ và điều kiện tổ chức; điều chỉnh đánh giá phù hợp"], "explanation": "", "level": "VDC", "answer": 3, "source": "22/2021/TT-BGDĐT Điều 3–4; 46/2020 mục VII"}, {"id": 65, "set": 2, "number": 25, "text": "Theo nội dung cơ bản các luật về quốc phòng và an ninh ở SGK 10, thái độ nào phù hợp với trách nhiệm công dân?", "options": ["Chỉ tuân thủ quy định liên quan đến ngành nghề đang theo học", "Chủ động tìm hiểu và tuân thủ các quy định pháp luật về quốc phòng, an ninh", "Chỉ quan tâm luật khi phát sinh vi phạm bị xử lý", "Giao toàn bộ trách nhiệm tìm hiểu luật cho cơ quan chức năng"], "explanation": "", "level": "NB–TH", "answer": 1, "source": "SGK KNTT GDQP-AN 10 Bài 2, tr.11–15; 48/VBHN-VPQH Điều 7"}, {"id": 66, "set": 2, "number": 26, "text": "Điểm chung nào nổi bật trong truyền thống các lực lượng vũ trang nhân dân Việt Nam?", "options": ["Chỉ tồn tại trong thời kỳ có chiến tranh", "Không liên quan đến nhiệm vụ bảo vệ trật tự, an toàn xã hội", "Hoạt động độc lập với nhân dân và chỉ chú trọng lợi ích ngành", "Gắn bó với nhân dân và tinh thần chiến đấu bảo vệ Tổ quốc"], "explanation": "", "level": "NB–TH", "answer": 3, "source": "SGK KNTT GDQP-AN 10 Bài 1, tr.5–10"}, {"id": 67, "set": 2, "number": 27, "text": "Trong dạy học chủ đề an toàn giao thông, ví dụ nào thuộc hành vi cần phòng ngừa?", "options": ["Không tuân thủ tín hiệu điều khiển giao thông", "Đội mũ bảo hiểm đúng quy cách khi thuộc diện bắt buộc", "Đi đúng phần đường và làn đường phù hợp", "Dừng phương tiện theo tín hiệu người điều khiển giao thông"], "explanation": "", "level": "NB–TH", "answer": 0, "source": "SGK KNTT GDQP-AN 10 Bài 4, tr.21–26"}, {"id": 68, "set": 2, "number": 28, "text": "Một nhóm học sinh thấy thông tin sai lệch về lực lượng vũ trang lan truyền trên mạng. Cách ứng xử phù hợp nhất với giáo dục truyền thống và an ninh mạng là gì?", "options": ["Xóa mọi tin nhắn liên quan mà không tìm hiểu nội dung", "Chia sẻ để thăm dò phản ứng của cộng đồng rồi mới xác minh", "Dùng tài khoản ẩn danh phản bác bằng thông tin chưa kiểm chứng", "Kiểm chứng từ nguồn chính thống, không tiếp tay phát tán và trao đổi dựa trên chứng cứ"], "explanation": "", "level": "VD", "answer": 3, "source": "SGK KNTT GDQP-AN 10 Bài 1 và Bài 6, tr.5–10, 31–35"}, {"id": 69, "set": 2, "number": 29, "text": "Nội dung nào thuộc trách nhiệm học sinh với nghĩa vụ quân sự được đề cập trong SGK 11?", "options": ["Thay cơ quan quân sự tổ chức đăng ký cho toàn địa bàn", "Cấp giấy chứng nhận hoàn thành nghĩa vụ quân sự", "Tự quyết định danh sách công dân gọi nhập ngũ của địa phương", "Tìm hiểu và chấp hành quy định pháp luật phù hợp lứa tuổi"], "explanation": "", "level": "NB–TH", "answer": 3, "source": "SGK KNTT GDQP-AN 11 Bài 2, tr.17–18"}, {"id": 70, "set": 2, "number": 30, "text": "Khái niệm khu vực biên giới trên đất liền trong SGK 11 gắn với đơn vị hành chính nào?", "options": ["Chỉ đất nằm trong phạm vi 100 mét từ mốc giới", "Các xã, phường có một phần địa giới hành chính trùng với biên giới quốc gia trên đất liền", "Mọi huyện, thị xã trong cùng tỉnh có đường biên giới", "Chỉ các cửa khẩu quốc tế được cấp phép"], "explanation": "", "level": "NB–TH", "answer": 1, "source": "SGK KNTT GDQP-AN 11 Bài 1, tr.7"}, {"id": 71, "set": 2, "number": 31, "text": "Theo SGK 11 về chủ quyền biển đảo, nhận định nào đúng?", "options": ["Vùng đặc quyền kinh tế luôn chỉ rộng 12 hải lý", "Thềm lục địa chỉ là phần đất thuộc khu vực ven bờ", "Chủ quyền, quyền chủ quyền và quyền tài phán phải được phân biệt theo vùng biển và pháp luật liên quan", "Mọi vùng biển đều có chế độ pháp lý giống lãnh thổ đất liền"], "explanation": "", "level": "NB–TH", "answer": 2, "source": "SGK KNTT GDQP-AN 11 Bài 1, tr.8–9; UNCLOS 1982"}, {"id": 72, "set": 2, "number": 32, "text": "Một học sinh cho rằng tham gia nghĩa vụ quân sự là trách nhiệm riêng của người đã có việc làm. Giáo viên nên giải thích thế nào?", "options": ["Căn cứ vào điều kiện và độ tuổi theo luật, không lấy tình trạng việc làm làm tiêu chí duy nhất", "Cho rằng việc thực hiện nghĩa vụ hoàn toàn tự nguyện, không có điều kiện pháp lý", "Khẳng định chỉ người không có việc làm mới phải thực hiện nghĩa vụ", "Cho rằng mọi công dân đều nhập ngũ ngay khi đủ 17 tuổi"], "explanation": "", "level": "VD", "answer": 0, "source": "SGK KNTT GDQP-AN 11 Bài 2, tr.11–18; đối chiếu luật nghĩa vụ quân sự hiện hành"}, {"id": 73, "set": 2, "number": 33, "text": "Trong chủ đề chiến lược “diễn biến hòa bình”, mục đích của thủ đoạn này được trình bày như thế nào?", "options": ["Tuyên truyền kiến thức quốc phòng theo chương trình giáo dục", "Thúc đẩy hợp tác kinh tế bình đẳng dựa trên luật pháp quốc tế", "Tác động làm suy yếu và tiến tới thay đổi chế độ chính trị từ bên trong", "Tổ chức giao lưu học thuật có kiểm chứng công khai"], "explanation": "", "level": "NB–TH", "answer": 2, "source": "SGK KNTT GDQP-AN 12 Bài 4, tr.31–37"}, {"id": 74, "set": 2, "number": 34, "text": "Bảo vệ chủ quyền biển, đảo sau năm 1975 trong SGK 12 gắn với yêu cầu nào?", "options": ["Kiên quyết bảo vệ chủ quyền và giải quyết bất đồng bằng biện pháp phù hợp luật pháp quốc tế", "Chỉ thực hiện nhiệm vụ bảo vệ trên đất liền", "Coi mọi hoạt động trên biển của các nước đều có cùng chế độ pháp lý", "Không cần phân biệt quyền chủ quyền và chủ quyền"], "explanation": "", "level": "NB–TH", "answer": 0, "source": "SGK KNTT GDQP-AN 12 Bài 1, tr.9–12"}, {"id": 75, "set": 2, "number": 35, "text": "Nguồn tư liệu nào phù hợp nhất để học sinh tìm hiểu truyền thống lực lượng vũ trang tại địa phương?", "options": ["Chỉ các hình ảnh không có chú thích và xuất xứ", "Chỉ bài đăng mạng không ghi tác giả, thời điểm", "Tư liệu bảo tàng, cơ quan lưu trữ, nhân chứng được kiểm chứng và lịch sử địa phương", "Chỉ lời truyền miệng chưa được đối chiếu"], "explanation": "", "level": "NB–TH", "answer": 2, "source": "SGK KNTT GDQP-AN 12 Bài 5, tr.38–46"}, {"id": 76, "set": 2, "number": 36, "text": "Khi thuyết trình về truyền thống địa phương, nhóm học sinh sử dụng một câu chuyện cảm động nhưng chưa có nguồn đáng tin. Giáo viên nên quyết định thế nào?", "options": ["Bỏ toàn bộ bài thuyết trình mà không hướng dẫn điều chỉnh", "Cho phép khẳng định sự kiện nếu cả nhóm đều tin vào nội dung", "Ghi nhận ý tưởng, yêu cầu xác minh hoặc chuyển thành ví dụ minh họa có chú thích, không trình bày như sự kiện đã xác thực", "Giữ nguyên vì giá trị cảm xúc quan trọng hơn độ chính xác lịch sử"], "explanation": "", "level": "VDC", "answer": 2, "source": "SGK KNTT GDQP-AN 12 Bài 5, tr.38–46; yêu cầu dạy học dựa tư liệu"}, {"id": 77, "set": 2, "number": 37, "text": "Theo định hướng đánh giá của Thông tư 46/2020, lựa chọn nào phù hợp?", "options": ["Chỉ đánh giá định kỳ bằng bài viết cho mọi nội dung", "Dùng một công cụ duy nhất cho mọi yêu cầu cần đạt", "Không sử dụng quan sát trong đánh giá thực hành", "Phối hợp đánh giá thường xuyên và định kỳ, chú trọng cả nhận thức và kỹ năng"], "explanation": "", "level": "NB–TH", "answer": 3, "source": "46/2020/TT-BGDĐT mục VII"}, {"id": 78, "set": 2, "number": 38, "text": "Thông tin thu được qua quan sát luyện tập có thể được sử dụng cho mục đích nào trong đánh giá GDQP-AN?", "options": ["Chỉ để so sánh tốc độ giữa các nhóm", "Phản hồi kịp thời, điều chỉnh dạy học và hỗ trợ tiến bộ", "Chỉ để ghi nhận việc có mặt của người học", "Chỉ để tạo điểm thi định kỳ thay cho mọi hình thức khác"], "explanation": "", "level": "NB–TH", "answer": 1, "source": "46/2020/TT-BGDĐT mục VII; 22/2021 Điều 2–4"}, {"id": 79, "set": 2, "number": 39, "text": "Khi học sinh tranh luận về một tình huống GDQP-AN có yếu tố pháp luật mới thay đổi, giáo viên cần ưu tiên gì?", "options": ["Tra cứu văn bản có hiệu lực, đối chiếu điều khoản trước khi kết luận và hướng dẫn học sinh kiểm chứng", "Dùng kết quả bình chọn của lớp làm nguồn xác định pháp luật", "Căn cứ lời giải SGK bất kể thời điểm xuất bản và thay đổi pháp luật", "Bỏ qua nội dung vì pháp luật có thể thay đổi"], "explanation": "", "level": "VD", "answer": 0, "source": "46/2020/TT-BGDĐT mục VI; các văn bản pháp luật liên quan"}, {"id": 80, "set": 2, "number": 40, "text": "Hai nhóm có điểm trắc nghiệm ngang nhau nhưng một nhóm thao tác đúng, nhóm kia chưa đáp ứng an toàn. Để bảo đảm giá trị đánh giá, nên làm gì?", "options": ["Đối chiếu từng yêu cầu cần đạt, đánh giá riêng minh chứng thực hành và kiến thức theo tiêu chí công khai", "Chọn điểm trung bình chung, không phân tích từng năng lực thành phần", "Cộng điểm nhóm có thao tác nhanh, bỏ qua độ an toàn", "Coi điểm trắc nghiệm là đủ để công nhận mọi kỹ năng thực hành"], "explanation": "", "level": "VDC", "answer": 0, "source": "46/2020/TT-BGDĐT mục VII; 22/2021 Điều 4"}];</script><script>const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='gdqp-ab-bien-soan-lai-80-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{wrong:[],bookmarks:[],history:[]}}catch{db={wrong:[],bookmarks:[],history:[]}}let active=null,timer=null;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}};const bank=QUESTIONS.filter(q=>!q.placeholder);const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function dashboard(){clearInterval(timer);active=null;$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">GDQP&AN · Tài liệu ôn luyện được cung cấp</div><h1>Ôn luyện GDQP&AN · Đề A – B</h1><p>80 câu hỏi · Đề A và đề B, mỗi đề 40 câu. Luyện từng câu, tra cứu tài liệu và xem lại kết quả.</p><button class="lime" data-start="practice">Luyện tổng hợp 80 câu →</button></div><div class="emblem">★<small>ÔN TẬP KIẾN THỨC</small></div></section><section class="stats"><div class="stat"><strong>80</strong><span class="muted">Câu hỏi đầy đủ</span></div><div class="stat"><strong>${db.history.length}</strong><span class="muted">Lượt đã hoàn thành</span></div><div class="stat"><strong>${db.wrong.length}</strong><span class="muted">Câu cần ôn lại</span></div><div class="stat"><strong>${db.bookmarks.length}</strong><span class="muted">Câu đã đánh dấu</span></div></section><div class="notice">Nội dung, đáp án và nguồn dẫn được nhập từ file anh cung cấp, chưa thẩm định lại. Nguồn đối chiếu được hiển thị khi kiểm tra đáp án. Đây là hai đề thi thử/dự thảo, cần tiếp tục rà soát pháp lý và nghiệp vụ theo lưu ý trong tài liệu. Vị trí phương án được đảo khi luyện. Thời gian thi thử do anh chọn, không phải thời gian quy định trong tài liệu.</div><div class="panel"><h3>Thiết lập thời gian mỗi đề</h3><select id="duration" aria-label="Thời gian thi thử"><option value="40" selected>40 phút</option><option value="50">50 phút</option><option value="60">60 phút</option></select></div><h2 style="margin-top:25px">Chọn bộ đề</h2><section class="grid">${[1,2].map(n=>`<article class="card"><span class="tag">ĐỀ ${n===1?'A':'B'} · 40 CÂU</span><h3>Đề ${n===1?'A':'B'}</h3><button data-topic="${n}">Luyện từng câu →</button><button class="primary" data-exam="${n}">Thi thử đề ${n===1?'A':'B'} →</button></article>`).join('')}<article class="card"><h3>Củng cố kiến thức</h3><button data-start="wrong">Ôn câu sai (${db.wrong.length})</button><button data-start="bookmarks">Câu đánh dấu (${db.bookmarks.length})</button></article></section><h2 style="margin-top:30px">Tra cứu câu hỏi</h2><div class="tools"><input id="search" placeholder="Tìm nội dung câu hỏi…" aria-label="Tìm câu hỏi"><select id="level" aria-label="Mức độ"><option value="">Tất cả mức độ</option>${[...new Set(bank.map(q=>q.level))].map(l=>`<option>${esc(l)}</option>`).join('')}</select><button id="browse">Tra cứu</button></div><div id="searchResults"></div><h2 style="margin-top:30px">Lịch sử luyện tập</h2>${db.history.slice(0,10).map(h=>`<div class="history row"><span>${esc(h.mode)} · ${esc(h.date)}</span><b>${h.correct}/${h.total} câu đúng · ${h.score}/10</b></div>`).join('')||'<p class="muted">Chưa có lượt hoàn thành.</p>'}<p class="muted">Tiến độ được lưu trên trình duyệt và thiết bị đang sử dụng.</p>`;document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>start('practice',+b.dataset.topic));document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>start('exam',+b.dataset.exam));$('#browse').onclick=browse;$('#search').oninput=browse;$('#level').onchange=browse}
function browse(){let s=$('#search').value.toLocaleLowerCase('vi'),l=$('#level').value;let list=bank.filter(q=>(!l||q.level===l)&&(q.text+' '+q.options.join(' ')).toLocaleLowerCase('vi').includes(s));$('#searchResults').innerHTML=`<p class="muted">${list.length} câu phù hợp</p>`+list.map(q=>`<div class="review-item"><span class="tag">Đề ${q.set===1?'A':'B'} · Câu ${q.number} · ${esc(q.level)}</span><p>${esc(q.text)}</p><details><summary>Xem phương án và đáp án từ tài liệu</summary>${q.options.map((o,i)=>`<p>${'ABCD'[i]}. ${esc(o)} ${i===q.answer?'✓':''}</p>`).join('')}</details></div>`).join('')}
function start(mode,topic){let minutes=Number($('#duration')?.value||50);let qs=mode==='wrong'?bank.filter(q=>db.wrong.includes(q.id)):mode==='bookmarks'?bank.filter(q=>db.bookmarks.includes(q.id)):bank.slice();if(topic)qs=qs.filter(q=>q.set===topic);qs=qs.map(q=>{let opts=shuffle(q.options.map((text,index)=>({text,index})));return {...q,options:opts.map(o=>o.text),answer:opts.findIndex(o=>o.index===q.answer)}});if(!qs.length){alert('Chưa có câu trong danh sách này. Anh hãy luyện hoặc đánh dấu câu trước nhé.');return}if(mode!=='exam')qs=shuffle(qs);active={mode,qs,answers:{},revealed:{},i:0,end:Date.now()+minutes*60000};renderQuiz();if(mode==='exam')timer=setInterval(()=>{if(!active)return;let remain=Math.max(0,Math.ceil((active.end-Date.now())/1000));let el=$('#clock');if(el)el.textContent=fmt(remain);if(!remain)finish(false)},1000)}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function renderQuiz(){let a=active,q=a.qs[a.i],ans=a.answers[q.id],show=a.revealed[q.id],done=Object.keys(a.answers).length;$('#app').innerHTML=`<div class="row"><div><div class="eyebrow" style="color:#627d50">${a.mode==='exam'?`THI THỬ · BỘ ĐỀ ${a.qs[0].set===1?'A':'B'}`:'LUYỆN TẬP · PHẢN HỒI TỪNG CÂU'}</div><h2>Vững kiến thức, tự tin hơn</h2></div><button id="exit">Thoát</button></div><div class="quiz"><section class="panel"><div class="row"><span class="tag">Câu ${a.i+1}/${a.qs.length} · ${esc(q.level)}</span><button id="bookmark" aria-label="Đánh dấu câu">${db.bookmarks.includes(q.id)?'★ Đã đánh dấu':'☆ Đánh dấu'}</button></div><div class="question">${esc(q.text)}</div>${q.options.map((o,i)=>`<button class="option ${ans===i?'selected':''} ${show&&i===q.answer?'correct':''} ${show&&ans===i&&i!==q.answer?'wrong':''}" data-option="${i}" ${show?'disabled':''}><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}${show?`<div class="answer-note">${q.explanation?`<p>${esc(q.explanation)}</p>`:''}<b>${ans===q.answer?'✓ Trùng đáp án tài liệu':'Đáp án tài liệu: '+ 'ABCD'[q.answer]}</b><div class="muted">Nguồn dẫn trong file: ${esc(q.source)} · Câu gốc ${q.number}. Chưa thẩm định nguồn.</div></div>`:''}<div class="row" style="margin-top:22px"><button id="prev" ${a.i===0?'disabled':''}>← Trước</button>${a.mode!=='exam'&&!show?`<button class="primary" id="check" ${ans===undefined?'disabled':''}>Kiểm tra đáp án</button>`:''}<button id="next" ${a.i===a.qs.length-1?'disabled':''}>Tiếp →</button></div></section><aside class="panel">${a.mode==='exam'?`<div class="muted">Thời gian còn lại</div><div class="timer" id="clock">${fmt(Math.max(0,Math.ceil((a.end-Date.now())/1000)))}</div>`:'<h3>Tiến độ luyện tập</h3>'}<div class="muted">Đã chọn ${done}/${a.qs.length} câu</div><div class="progress"><i style="width:${done/a.qs.length*100}%"></i></div><div class="numbers">${a.qs.map((v,i)=>`<button data-jump="${i}" class="${a.answers[v.id]!==undefined?'selected':''} ${i===a.i?'current':''}">${i+1}${db.bookmarks.includes(v.id)?'★':''}</button>`).join('')}</div><button class="primary" style="width:100%" id="finish">${a.mode==='exam'?'Nộp bài':'Kết thúc & xem kết quả'}</button><p class="muted">${a.mode==='exam'?'Đáp án hiển thị sau khi nộp bài.':'Chọn phương án rồi nhấn Kiểm tra đáp án.'}</p></aside></div>`;document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{a.answers[q.id]=+b.dataset.option;renderQuiz()});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{a.i=+b.dataset.jump;renderQuiz()});$('#prev').onclick=()=>{a.i--;renderQuiz()};$('#next').onclick=()=>{a.i++;renderQuiz()};if($('#check'))$('#check').onclick=()=>{a.revealed[q.id]=true;renderQuiz()};$('#bookmark').onclick=()=>{db.bookmarks=db.bookmarks.includes(q.id)?db.bookmarks.filter(id=>id!==q.id):[...db.bookmarks,q.id];save();renderQuiz()};$('#exit').onclick=()=>{if(confirm('Thoát lượt đang làm? Kết quả lượt này chưa được lưu.'))dashboard()};$('#finish').onclick=()=>finish(true)}
function finish(ask){if(!active)return;let a=active,missing=a.qs.length-Object.keys(a.answers).length;if(ask&&!confirm(missing?`Còn ${missing} câu chưa chọn. Anh muốn kết thúc và chấm bài?`:'Kết thúc và chấm bài?'))return;clearInterval(timer);let correct=a.qs.filter(q=>a.answers[q.id]===q.answer).length;for(let q of a.qs){if(a.answers[q.id]===q.answer)db.wrong=db.wrong.filter(id=>id!==q.id);else if(!db.wrong.includes(q.id))db.wrong.push(q.id)}let score=(correct/a.qs.length*10).toFixed(2);db.history.unshift({mode:(a.mode==='exam'?'Thi thử':'Luyện tập')+(a.qs.every(q=>q.set===a.qs[0].set)?' đề '+(a.qs[0].set===1?'A':'B'):' tổng hợp'),date:new Date().toLocaleString('vi-VN'),correct,total:a.qs.length,score});db.history=db.history.slice(0,50);save();$('#app').innerHTML=`<section class="panel score"><span class="tag">ĐÃ HOÀN THÀNH</span><h1>Kết quả của anh</h1><strong>${score}<small style="font-size:20px">/10</small></strong><p>${correct}/${a.qs.length} câu trùng đáp án tài liệu · ${missing} câu chưa trả lời</p><div class="tools" style="justify-content:center"><button class="primary" id="again">Ôn câu sai</button><button id="back">Về tổng quan</button></div><p class="muted">Điểm luyện tập được quy đổi tuyến tính theo số câu đúng, không thay thế thang điểm hội thi.</p></section><h2 style="margin-top:28px">Xem lại bài làm</h2><section class="panel">${a.qs.map(q=>`<div class="review-item"><span class="tag">Đề ${q.set===1?'A':'B'} · Câu ${q.number} · ${a.answers[q.id]===q.answer?'Đúng theo tài liệu':'Cần ôn lại'}</span><p><b>${esc(q.text)}</b></p><p class="muted">Nguồn dẫn trong file: ${esc(q.source)}</p>${q.options.map((o,i)=>`<p style="color:${i===q.answer?'#26763d':a.answers[q.id]===i?'#b35543':'inherit'}">${'ABCD'[i]}. ${esc(o)} ${i===q.answer?'✓ Đáp án tài liệu':''}${a.answers[q.id]===i?' · Anh chọn':''}</p>`).join('')}</div>`).join('')}</section>`;active=null;$('#again').onclick=()=>start('wrong');$('#back').onclick=dashboard;window.scrollTo(0,0)}
$('#home').onclick=$('#logo').onclick=e=>{e.preventDefault();if(!active||confirm('Thoát lượt đang làm? Kết quả lượt này chưa được lưu.'))dashboard()};dashboard();
</script></body></html>
